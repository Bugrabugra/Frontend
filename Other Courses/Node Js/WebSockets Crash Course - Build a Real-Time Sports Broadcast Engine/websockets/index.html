<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Websocket Live Test Rig</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #121212;
        color: #fff;

        #log {
          background-color: #000;
          padding: 10px;
          height: 300px;
          overflow-y: scroll;
          border: 1px solid #333;
        }

        .status-on {
          color: #0f0;
        }

        .status-off {
          color: #f00;
        }
      }
    </style>
  </head>
  <body>
    <h1>WebSocket Broadcast Console</h1>

    <p class="status-off" id="status">Connecting...</p>

    <form id="message-form">
      <input id="message-input" placeholder="Send cargo..." required type="text" />
      <button type="submit">Deploy Message</button>
    </form>

    <h3>Live Stream Logs:</h3>

    <pre id="log"></pre>
  </body>

  <script>
    const log = document.getElementById("log");
    const status = document.getElementById("status");
    const messageForm = document.getElementById("message-form");
    const messageInput = document.getElementById("message-input");

    // 1. initiate the handshake
    const socket = new WebSocket("ws://localhost:8080");

    const appendLog = (label, message) => {
      const entry = `${new Date().toLocaleTimeString()} ${label} ${message}\n`;
      log.textContent += entry;
      log.scrollTop = log.scrollHeight;
    }

    socket.addEventListener("open", () => {
      status.textContent = "Connected: ws://localhost:8080";
      status.classList.add("status-on");
      status.classList.remove("status-off");

      appendLog("[SYSTEM]", "Tunnel Established");
    })

    socket.addEventListener("close", () => {
      status.textContent = "Disconnected";
      status.classList.add("status-off");
      status.classList.remove("status-on");

      appendLog("[SYSTEM]", "Tunnel Collapsed");
    })

    socket.addEventListener("message", (event) => {
      appendLog("[RECEIVED]", event.data);
    })

    messageForm.addEventListener("submit", (event) => {
      event.preventDefault();

      if (socket.readyState !== WebSocket.OPEN) {
        appendLog("[ERROR]", "No active tunnel found");
        return;
      }

      const msg = messageInput.value.trim();
      socket.send(msg);
      appendLog("[SENT]", msg);
      messageInput.value = "";
    })
  </script>
</html>
